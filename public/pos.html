<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Duka POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<div id="pageCurtain"></div>

<div class="app">

  <!-- LEFT: catalog -->
  <div class="catalog">
    <header class="catalog-header">
      <div class="brand">
        <img src="logo.svg" alt="Duka POS logo" class="brand-mark">
        <div>
          <h1>Duka POS</h1>
          <p class="tagline">Leo ni leo — get paid on the spot</p>
        </div>
      </div>
      <div class="header-right">
        <div class="search">
          <input id="searchInput" type="text" placeholder="Search products…" autocomplete="off">
        </div>
        <div class="user-chip">
          <span id="userName">…</span>
          <button id="logoutBtn" class="logout-link">Log out</button>
        </div>
      </div>
    </header>

    <div class="categories" id="categories"></div>

    <div class="grid" id="productGrid"></div>
  </div>

  <!-- RIGHT: till roll -->
  <div class="till">
    <div class="till-roll" id="tillRoll">
      <div class="perforation top"></div>
      <div class="paid-stamp" id="paidStamp">PAID</div>

      <div class="till-head">
        <div class="till-title">SALE RECEIPT</div>
        <div class="till-sub" id="tillDate"></div>
      </div>

      <div class="till-items" id="tillItems">
        <div class="till-empty">No items yet — tap a product to begin</div>
      </div>

      <div class="till-divider"></div>

      <div class="till-row total-row">
        <span>TOTAL</span>
        <span id="tillTotal">KSh 0</span>
      </div>

      <div class="perforation bottom"></div>
    </div>

    <div class="checkout-panel">
      <label class="field-label" for="phoneInput">M-Pesa number</label>
      <input id="phoneInput" class="phone-input" type="tel" placeholder="07XX XXX XXX" inputmode="numeric">

      <button id="payBtn" class="pay-btn" disabled>
        <span class="pay-btn-label">Send STK Push</span>
        <span class="pay-btn-sub">Prompt customer's phone</span>
      </button>

      <div id="statusBanner" class="status-banner hidden"></div>

      <button id="clearBtn" class="clear-btn">Clear till</button>
    </div>
  </div>

</div>

<script src="transitions.js"></script>
<script src="app.js"></script>
</body>
</html>
