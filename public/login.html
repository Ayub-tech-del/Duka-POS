<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Duka POS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body.login-body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-deep);
    padding: 24px;
  }
  .auth-shell {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .auth-form-panel {
    padding: 44px 40px;
  }
  .auth-brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-brand-row img { width: 30px; height: 30px; border-radius: 8px; }
  .auth-brand-row span { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-soft); }
  .auth-form-panel h1 { font-family: var(--font-display); font-weight: 900; font-size: 28px; margin: 0 0 8px; color: var(--ink); }
  .auth-form-panel .auth-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 28px; }
  .setup-banner {
    background: rgba(217,154,43,0.15);
    border: 1px solid rgba(217,154,43,0.4);
    color: #8a5a1a;
    padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 18px; display: none;
  }
  .setup-banner.show { display: block; }
  .auth-error {
    background: rgba(122,32,54,0.1);
    border: 1px solid rgba(122,32,54,0.3);
    color: var(--rust);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .auth-error.show { display: block; }
  .auth-field { margin-bottom: 14px; }
  .auth-field input {
    width: 100%; padding: 13px 16px; border-radius: 10px; border: none;
    background: var(--paper-dim); font-family: var(--font-body); font-size: 14.5px; color: var(--ink); outline: none;
  }
  .auth-field input::placeholder { color: var(--ink-soft); }
  .auth-field input:focus { box-shadow: 0 0 0 2px var(--green); }
  .auth-field.invalid input { box-shadow: 0 0 0 2px var(--rust); }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 44px; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: none;
    color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover { color: var(--ink); }
  .auth-submit {
    width: 100%; margin-top: 8px; background: var(--green); color: var(--paper);
    border: none; border-radius: 10px; padding: 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 15px; cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .auth-submit:hover { background: var(--green-deep); transform: translateY(-1px); }
  .auth-divider { display: flex; align-items: center; color: var(--ink-soft); font-size: 12px; margin: 22px 0 16px; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }
  .auth-divider span { padding: 0 12px; }
  .social-row { display: flex; gap: 10px; justify-content: center; }
  .social-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line);
    background: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: box-shadow 0.12s, transform 0.12s;
  }
  .social-btn:hover { box-shadow: 0 4px 12px rgba(42,27,18,0.12); transform: translateY(-1px); }
</style>
</head>
<body class="login-body">

<div class="auth-shell">

  <div class="auth-form-panel">
    <div class="auth-brand-row">
      <img src="logo.svg" alt="Duka POS logo">
      <span>Duka POS</span>
    </div>
    <h1 id="authHeading">Hello again</h1>
    <p class="auth-sub" id="authSub">Sign in to get back to your till.</p>

    <div id="setupBanner" class="setup-banner">No account exists yet — create the owner login below to get started.</div>
    <div id="googleNote" class="setup-banner" style="background:rgba(66,133,244,0.1);border-color:rgba(66,133,244,0.3);color:#1a56b0;">Google sign-in isn't configured yet.</div>
    <div id="authError" class="auth-error"></div>

    <form id="authForm">
      <div class="auth-field" id="nameField" style="display:none">
        <input id="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <div class="auth-field">
        <input id="username" type="text" autocomplete="username" placeholder="Username" required>
      </div>
      <div class="auth-field" id="passwordField">
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">
            <svg id="pwEyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pwEyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-7-11-7a20.4 20.4 0 015.06-5.94M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 7 11 7a20.4 20.4 0 01-2.62 3.57M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>
    <div class="social-row">
      <button type="button" id="googleBtn" class="social-btn" aria-label="Continue with Google">
        <svg width="20" height="20" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93C16.64 14.2 17.64 11.9 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.93-2.27c-.81.54-1.85.86-3.03.86-2.33 0-4.3-1.57-5.01-3.68H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.99 10.73c-.18-.54-.28-1.12-.28-1.73s.1-1.19.28-1.73V4.93H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.07l3.03-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.6-2.6C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.93l3.03 2.34C4.7 5.15 6.67 3.58 9 3.58z"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  const pwToggle = document.getElementById('pwToggle');
  const pwEyeOpen = document.getElementById('pwEyeOpen');
  const pwEyeClosed = document.getElementById('pwEyeClosed');
  let pwRevealed = false;

  pwToggle.addEventListener('click', () => {
    pwRevealed = !pwRevealed;
    passwordInput.type = pwRevealed ? 'text' : 'password';
    pwEyeOpen.style.display = pwRevealed ? 'none' : 'block';
    pwEyeClosed.style.display = pwRevealed ? 'block' : 'none';
    pwToggle.setAttribute('aria-label', pwRevealed ? 'Hide password' : 'Show password');
  });

  passwordInput.addEventListener('input', () => {
    document.getElementById('passwordField').classList.remove('invalid');
  });

  const form = document.getElementById('authForm');
  const errorBox = document.getElementById('authError');
  const setupBanner = document.getElementById('setupBanner');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  const authHeading = document.getElementById('authHeading');
  const authSub = document.getElementById('authSub');
  let needsSetup = false;

  const googleBtn = document.getElementById('googleBtn');
  const googleNote = document.getElementById('googleNote');

  if (new URLSearchParams(window.location.search).get('google') === '1') {
    googleNote.classList.add('show');
  }
  googleBtn.addEventListener('click', () => {
    window.location.href = '/api/auth/google';
  });

  fetch('/api/auth/needs-setup')
    .then(r => r.json())
    .then(({ needsSetup: ns }) => {
      needsSetup = ns;
      if (ns) {
        setupBanner.classList.add('show');
        nameField.style.display = 'block';
        submitBtn.textContent = 'Create owner account';
        authHeading.textContent = 'Set up your shop';
        authSub.textContent = 'Create the owner account to get started.';
      }
    });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();

    const endpoint = needsSetup ? '/api/auth/setup' : '/api/auth/login';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, name }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Something went wrong';
        errorBox.classList.add('show');
        document.getElementById('passwordField').classList.add('invalid');
        return;
      }
      document.getElementById('passwordField').classList.remove('invalid');
      setTimeout(() => {
        window.location.href = data.role === 'owner' ? '/dashboard.html' : '/pos.html';
      }, 550);
    } catch (err) {
      errorBox.textContent = 'Could not reach the server.';
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
