<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Duka POS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-deep);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 8px 5px, rgba(245,239,224,0.05) 4px, transparent 4.5px);
    background-size: 32px 32px;
    pointer-events: none;
  }
  .auth-card {
    position: relative;
    width: 100%;
    max-width: 400px;
    background: var(--paper);
    border-radius: 18px;
    padding: 40px 34px 34px;
    box-shadow: var(--shadow);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .auth-mark {
    width: 44px; height: 44px;
    border-radius: 10px;
    object-fit: contain;
    flex-shrink: 0;
    font-weight: 900;
    font-size: 21px;
  }
  .auth-brand h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    margin: 0;
    color: var(--ink);
  }
  .auth-tag {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 2px 0 28px 58px;
  }
  .google-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 18px;
  }
  .google-btn:hover { box-shadow: 0 4px 12px rgba(20,32,26,0.1); }
  .divider {
    display: flex; align-items: center;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin: 0 0 20px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid var(--line);
  }
  .divider span { padding: 0 12px; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .auth-field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }
  .auth-field input:focus { border-color: var(--green); }
  .auth-submit {
    width: 100%;
    margin-top: 6px;
    background: var(--green);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .auth-submit:hover { background: var(--green-deep); transform: translateY(-1px); }
  .auth-error {
    background: rgba(181,72,42,0.1);
    border: 1px solid rgba(181,72,42,0.3);
    color: var(--rust);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-toggle {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--green);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    font-size: 13px;
  }
  .setup-banner {
    background: rgba(232,163,61,0.15);
    border: 1px solid rgba(232,163,61,0.4);
    color: #8a5a1a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-bottom: 18px;
    display: none;
  }
  .setup-banner.show { display: block; }

  .snake-trio {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -72%);
    display: flex;
    align-items: flex-end;
    gap: 14px;
    z-index: 2;
    pointer-events: none;
  }
  .snake { display: flex; flex-direction: column; align-items: center; transition: transform 0.15s ease; }
  .snake.shake { animation: snakeShake 0.5s ease; }
  .snake.jump { animation: snakeJump 0.6s ease; }
  @keyframes snakeShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-6deg); }
    40% { transform: translateX(6px) rotate(6deg); }
    60% { transform: translateX(-5px) rotate(-4deg); }
    80% { transform: translateX(5px) rotate(4deg); }
  }
  @keyframes snakeJump {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-16px); }
    55% { transform: translateY(2px); }
    75% { transform: translateY(-6px); }
  }
  .snake-body {
    width: 30px;
    border-radius: 15px 15px 6px 6px;
    background: var(--green);
  }
  .snake.side-a .snake-body { background: var(--marigold); }
  .snake.side-b .snake-body { background: var(--marigold); }
  .snake.tall .snake-body { height: 74px; }
  .snake.short .snake-body { height: 46px; }
  .snake-head {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    position: relative;
    margin-bottom: -6px;
  }
  .snake.side-a .snake-head, .snake.side-b .snake-head { background: var(--marigold); }
  .eye {
    width: 15px; height: 15px;
    background: var(--paper);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: height 0.15s ease, transform 0.15s ease;
  }
  .pupil {
    width: 7px; height: 7px;
    background: var(--ink);
    border-radius: 50%;
    transition: transform 0.05s linear;
  }
  .snake.shy .eye { height: 3px; transform: translateY(0); }
  .snake.shy .pupil { display: none; }
  .snake.shy .snake-head { transform: rotate(20deg); }
  .snake.side-a.shy .snake-head { transform: rotate(-24deg); }
  .snake.side-b.shy .snake-head { transform: rotate(24deg); }
  .snake-mouth {
    position: absolute;
    bottom: 8px;
    width: 14px; height: 6px;
    border-bottom: 2px solid var(--ink-soft);
    border-radius: 0 0 8px 8px;
    opacity: 0.6;
  }
  .snake.happy .snake-mouth {
    border-radius: 0 0 10px 10px;
    border-color: var(--ink);
    opacity: 1;
  }
  .snake.hurt .snake-mouth {
    border-bottom: none;
    border-top: 2px solid var(--rust);
    border-radius: 8px 8px 0 0;
    bottom: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    .snake.shake, .snake.jump { animation: none; }
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="snake-trio" id="snakeTrio">
      <div class="snake side-a short">
        <div class="snake-head">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
          <div class="snake-mouth"></div>
        </div>
        <div class="snake-body"></div>
      </div>
      <div class="snake center tall">
        <div class="snake-head">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
          <div class="snake-mouth"></div>
        </div>
        <div class="snake-body"></div>
      </div>
      <div class="snake side-b short">
        <div class="snake-head">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
          <div class="snake-mouth"></div>
        </div>
        <div class="snake-body"></div>
      </div>
    </div>

    <div class="auth-brand">
      <img src="logo.svg" alt="Duka POS logo" class="auth-mark">
      <h1>Duka POS</h1>
    </div>
    <p class="auth-tag">Leo ni leo — get paid on the spot</p>

    <div id="setupBanner" class="setup-banner">No account exists yet — create the owner login below to get started.</div>
    <div id="googleNote" class="setup-banner" style="background:rgba(66,133,244,0.1);border-color:rgba(66,133,244,0.3);color:#1a56b0;">Google sign-in needs a Google Cloud OAuth client set up first — for now, use a username and password below.</div>
    <div id="authError" class="auth-error"></div>

    <button type="button" id="googleBtn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93C16.64 14.2 17.64 11.9 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.93-2.27c-.81.54-1.85.86-3.03.86-2.33 0-4.3-1.57-5.01-3.68H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.99 10.73c-.18-.54-.28-1.12-.28-1.73s.1-1.19.28-1.73V4.93H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.07l3.03-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.6-2.6C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.93l3.03 2.34C4.7 5.15 6.67 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="divider"><span>or</span></div>

    <form id="authForm">
      <div class="auth-field" id="nameField" style="display:none">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name" placeholder="e.g. Ayub">
      </div>
      <div class="auth-field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign in</button>
    </form>
  </div>
</div>

<script>
  // ---- Snake mascot behavior ----
  const snakeTrio = document.getElementById('snakeTrio');
  const snakes = Array.from(document.querySelectorAll('.snake'));
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  let lookTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let following = true;

  function setLookTargetFromEl(el) {
    const r = el.getBoundingClientRect();
    lookTarget = { x: r.left + r.width / 2, y: r.top };
  }

  document.addEventListener('mousemove', (e) => {
    if (!following) return;
    lookTarget = { x: e.clientX, y: e.clientY };
  });

  function updatePupils() {
    if (!document.querySelector('.snake.shy')) {
      snakes.forEach(snake => {
        const pupils = snake.querySelectorAll('.pupil');
        pupils.forEach(pupil => {
          const eyeRect = pupil.parentElement.getBoundingClientRect();
          const cx = eyeRect.left + eyeRect.width / 2;
          const cy = eyeRect.top + eyeRect.height / 2;
          const angle = Math.atan2(lookTarget.y - cy, lookTarget.x - cx);
          const dist = Math.min(3.2, Math.hypot(lookTarget.x - cx, lookTarget.y - cy) / 20);
          pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        });
      });
    }
    requestAnimationFrame(updatePupils);
  }
  requestAnimationFrame(updatePupils);

  usernameInput.addEventListener('focus', () => {
    following = false;
    setLookTargetFromEl(usernameInput);
    snakes.forEach(s => s.classList.remove('shy'));
  });
  usernameInput.addEventListener('input', () => setLookTargetFromEl(usernameInput));
  usernameInput.addEventListener('blur', () => { following = true; });

  passwordInput.addEventListener('focus', () => {
    following = false;
    snakes.forEach(s => s.classList.add('shy'));
  });
  passwordInput.addEventListener('blur', () => {
    following = true;
    snakes.forEach(s => s.classList.remove('shy'));
  });

  function reactShake() {
    snakes.forEach(s => {
      s.classList.remove('happy');
      s.classList.add('hurt', 'shake');
      setTimeout(() => s.classList.remove('shake'), 500);
      setTimeout(() => s.classList.remove('hurt'), 1200);
    });
  }

  function reactHappy() {
    snakes.forEach(s => {
      s.classList.remove('hurt', 'shy');
      s.classList.add('happy', 'jump');
    });
  }

  // ---- Auth logic ----
  const form = document.getElementById('authForm');
  const errorBox = document.getElementById('authError');
  const setupBanner = document.getElementById('setupBanner');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  let needsSetup = false;

  const googleBtn = document.getElementById('googleBtn');
  const googleNote = document.getElementById('googleNote');

  if (new URLSearchParams(window.location.search).get('google') === '1') {
    googleNote.classList.add('show');
  }
  googleBtn.addEventListener('click', () => {
    googleNote.classList.add('show');
    googleNote.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  fetch('/api/auth/needs-setup')
    .then(r => r.json())
    .then(({ needsSetup: ns }) => {
      needsSetup = ns;
      if (ns) {
        setupBanner.classList.add('show');
        nameField.style.display = 'block';
        submitBtn.textContent = 'Create owner account';
      }
    });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();

    const endpoint = needsSetup ? '/api/auth/setup' : '/api/auth/login';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, name }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Something went wrong';
        errorBox.classList.add('show');
        reactShake();
        return;
      }
      reactHappy();
      setTimeout(() => {
        window.location.href = data.role === 'owner' ? '/dashboard.html' : '/pos.html';
      }, 550);
    } catch (err) {
      errorBox.textContent = 'Could not reach the server.';
      errorBox.classList.add('show');
      reactShake();
    }
  });
</script>
</body>
</html>
