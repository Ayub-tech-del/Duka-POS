<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Duka POS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body.login-body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-deep);
    padding: 24px;
  }
  .auth-shell {
    width: 100%;
    max-width: 900px;
    min-height: 560px;
    background: var(--paper);
    border-radius: 26px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }
  .auth-form-panel {
    padding: 48px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .auth-brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-brand-row img { width: 30px; height: 30px; border-radius: 8px; }
  .auth-brand-row span { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-soft); }
  .auth-form-panel h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 0 0 8px; color: var(--ink); }
  .auth-form-panel .auth-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 28px; }
  .setup-banner {
    background: rgba(217,154,43,0.15);
    border: 1px solid rgba(217,154,43,0.4);
    color: #8a5a1a;
    padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 18px; display: none;
  }
  .setup-banner.show { display: block; }
  .auth-error {
    background: rgba(122,32,54,0.1);
    border: 1px solid rgba(122,32,54,0.3);
    color: var(--rust);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .auth-error.show { display: block; }
  .auth-field { margin-bottom: 14px; }
  .auth-field input {
    width: 100%; padding: 13px 16px; border-radius: 10px; border: none;
    background: var(--paper-dim); font-family: var(--font-body); font-size: 14.5px; color: var(--ink); outline: none;
  }
  .auth-field input::placeholder { color: var(--ink-soft); }
  .auth-field input:focus { box-shadow: 0 0 0 2px var(--green); }
  .auth-field.invalid input { box-shadow: 0 0 0 2px var(--rust); }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 44px; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: none;
    color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .pw-toggle:hover { color: var(--ink); }
  .auth-submit {
    width: 100%; margin-top: 8px; background: var(--green); color: var(--paper);
    border: none; border-radius: 10px; padding: 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 15px; cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .auth-submit:hover { background: var(--green-deep); transform: translateY(-1px); }
  .auth-divider { display: flex; align-items: center; color: var(--ink-soft); font-size: 12px; margin: 22px 0 16px; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }
  .auth-divider span { padding: 0 12px; }
  .social-row { display: flex; gap: 10px; justify-content: center; }
  .social-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line);
    background: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: box-shadow 0.12s, transform 0.12s;
  }
  .social-btn:hover { box-shadow: 0 4px 12px rgba(42,27,18,0.12); transform: translateY(-1px); }

  .auth-scene {
    position: relative;
    background: linear-gradient(180deg, #8a3d1f 0%, #c1592f 38%, #d99a2b 65%, #f0e0c4 100%);
    overflow: hidden;
  }
  .scene-sun { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; border-radius: 50%; background: rgba(249,240,225,0.85); }
  .scene-hill { position: absolute; left: -10%; width: 120%; border-radius: 50% 50% 0 0; background: var(--ink); }
  .scene-hill.back { bottom: -6%; height: 46%; opacity: 0.55; }
  .scene-hill.front { bottom: -10%; height: 34%; opacity: 0.85; }
  .scene-stall {
    position: absolute; bottom: 14%; width: 26px; height: 34px; background: var(--ink); opacity: 0.8;
    clip-path: polygon(0 100%, 0 40%, 50% 10%, 100% 40%, 100% 100%);
  }
  .scene-caption {
    position: absolute; left: 28px; right: 28px; bottom: 26px; color: var(--paper);
    font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.4;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .blob-crew { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: 260px; height: 190px; z-index: 2; }
  .blob { position: absolute; bottom: 0; transition: transform 0.15s ease; }
  .blob.shake { animation: blobShake 0.5s ease; }
  .blob.jump { animation: blobJump 0.6s ease; }
  @keyframes blobShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-5deg); }
    40% { transform: translateX(6px) rotate(5deg); }
    60% { transform: translateX(-5px) rotate(-3deg); }
    80% { transform: translateX(5px) rotate(3deg); }
  }
  @keyframes blobJump {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-16px); }
    55% { transform: translateY(2px); }
    75% { transform: translateY(-6px); }
  }
  @keyframes blobBob {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-5px) scaleY(1.02); }
  }
  .blob-body { position: relative; transform-origin: bottom center; animation: blobBob 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .blob.shake, .blob.jump, .blob-body { animation: none; }
  }

  .blob-purple { left: 30px; z-index: 1; }
  .blob-purple .blob-body { width: 90px; height: 168px; border-radius: 40px; background: #6b4fd6; animation-delay: 0s; }
  .blob-pink { left: 118px; z-index: 2; }
  .blob-pink .blob-body { width: 66px; height: 120px; border-radius: 32px; background: #d6407e; animation-delay: 0.4s; }
  .blob-yellow { left: 186px; z-index: 2; }
  .blob-yellow .blob-body { width: 56px; height: 98px; border-radius: 28px; background: #f0c23d; animation-delay: 0.8s; }
  .blob-orange { left: 0; z-index: 3; }
  .blob-orange .blob-body { width: 148px; height: 74px; border-radius: 74px 74px 0 0; background: #f0913d; animation-delay: 1.2s; }

  .blob-face { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .blob-orange .blob-face { top: 20px; }
  .b-eye { width: 15px; height: 15px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: height 0.15s ease; }
  .b-pupil { width: 7px; height: 7px; background: #1a1a1a; border-radius: 50%; transition: transform 0.05s linear; }
  .blob-yellow .b-eye:first-child { opacity: 0; }
  .blob.shy .b-eye { height: 2px; }
  .blob.shy .b-pupil { display: none; }

  .blob-mouth {
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 0 0 10px 10px; opacity: 0.85;
  }
  .blob-purple .blob-mouth { top: 50px; width: 18px; height: 9px; border-bottom: 2.5px solid rgba(0,0,0,0.65); border-radius: 0 0 10px 10px; }
  .blob-yellow .blob-mouth { top: 38px; left: 62%; width: 30px; height: 2px; background: rgba(0,0,0,0.7); border-radius: 2px; }
  .blob-orange .blob-mouth { top: 44px; width: 16px; height: 8px; border-bottom: 2.5px solid rgba(0,0,0,0.6); border-radius: 0 0 9px 9px; }
  .blob-pink .blob-mouth { display: none; }

  .blob.hurt .blob-mouth { border-bottom: none; border-top: 2.5px solid rgba(0,0,0,0.7); border-radius: 9px 9px 0 0; }
  .blob-yellow.hurt .blob-mouth { background: none; border-top: 2.5px solid rgba(0,0,0,0.7); height: 6px; border-radius: 6px 6px 0 0; }
  .blob.happy .blob-mouth { opacity: 1; }

  @media (max-width: 720px) {
    .auth-shell { grid-template-columns: 1fr; max-width: 420px; }
    .auth-scene { min-height: 220px; order: -1; }
    .auth-form-panel { padding: 36px 28px; }
  }
</style>
</head>
<body class="login-body">

<div class="auth-shell">

  <div class="auth-form-panel">
    <div class="auth-brand-row">
      <img src="logo.svg" alt="Duka POS logo">
      <span>Duka POS</span>
    </div>
    <h1 id="authHeading">Hello again</h1>
    <p class="auth-sub" id="authSub">Sign in to get back to your till.</p>

    <div id="setupBanner" class="setup-banner">No account exists yet — create the owner login below to get started.</div>
    <div id="googleNote" class="setup-banner" style="background:rgba(66,133,244,0.1);border-color:rgba(66,133,244,0.3);color:#1a56b0;">Google sign-in isn't configured yet.</div>
    <div id="authError" class="auth-error"></div>

    <form id="authForm">
      <div class="auth-field" id="nameField" style="display:none">
        <input id="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <div class="auth-field">
        <input id="username" type="text" autocomplete="username" placeholder="Username" required>
      </div>
      <div class="auth-field" id="passwordField">
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">
            <svg id="pwEyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pwEyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-7-11-7a20.4 20.4 0 015.06-5.94M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 7 11 7a20.4 20.4 0 01-2.62 3.57M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-divider"><span>or continue with</span></div>
    <div class="social-row">
      <button type="button" id="googleBtn" class="social-btn" aria-label="Continue with Google">
        <svg width="20" height="20" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93C16.64 14.2 17.64 11.9 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.93-2.27c-.81.54-1.85.86-3.03.86-2.33 0-4.3-1.57-5.01-3.68H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.99 10.73c-.18-.54-.28-1.12-.28-1.73s.1-1.19.28-1.73V4.93H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.07l3.03-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.6-2.6C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.93l3.03 2.34C4.7 5.15 6.67 3.58 9 3.58z"/></svg>
      </button>
    </div>
  </div>

  <div class="auth-scene">
    <div class="scene-sun"></div>
    <div class="scene-hill back"></div>
    <div class="scene-stall" style="left:12%;"></div>
    <div class="scene-stall" style="right:16%; bottom:16%;"></div>
    <div class="scene-hill front"></div>

    <div class="blob-crew" id="blobCrew">
      <div class="blob blob-purple">
        <div class="blob-body">
          <div class="blob-face"><div class="b-eye"><div class="b-pupil"></div></div><div class="b-eye"><div class="b-pupil"></div></div></div>
          <div class="blob-mouth"></div>
        </div>
      </div>
      <div class="blob blob-pink">
        <div class="blob-body">
          <div class="blob-face"><div class="b-eye"><div class="b-pupil"></div></div><div class="b-eye"><div class="b-pupil"></div></div></div>
          <div class="blob-mouth"></div>
        </div>
      </div>
      <div class="blob blob-yellow">
        <div class="blob-body">
          <div class="blob-face"><div class="b-eye"><div class="b-pupil"></div></div><div class="b-eye"><div class="b-pupil"></div></div></div>
          <div class="blob-mouth"></div>
        </div>
      </div>
      <div class="blob blob-orange">
        <div class="blob-body">
          <div class="blob-face"><div class="b-eye"><div class="b-pupil"></div></div><div class="b-eye"><div class="b-pupil"></div></div></div>
          <div class="blob-mouth"></div>
        </div>
      </div>
    </div>

    <p class="scene-caption">Get paid the moment they tap pay.</p>
  </div>

</div>

<script>
  const snakes = Array.from(document.querySelectorAll('.blob'));
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  let lookTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  let following = true;

  function setLookTargetFromEl(el) {
    const r = el.getBoundingClientRect();
    lookTarget = { x: r.left + r.width / 2, y: r.top };
  }

  document.addEventListener('mousemove', (e) => {
    if (!following) return;
    lookTarget = { x: e.clientX, y: e.clientY };
  });

  function updatePupils() {
    if (!document.querySelector('.blob.shy')) {
      snakes.forEach(snake => {
        snake.querySelectorAll('.b-pupil').forEach(pupil => {
          const eyeRect = pupil.parentElement.getBoundingClientRect();
          const cx = eyeRect.left + eyeRect.width / 2;
          const cy = eyeRect.top + eyeRect.height / 2;
          const angle = Math.atan2(lookTarget.y - cy, lookTarget.x - cx);
          const dist = Math.min(3.4, Math.hypot(lookTarget.x - cx, lookTarget.y - cy) / 20);
          pupil.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
        });
      });
    }
    requestAnimationFrame(updatePupils);
  }
  requestAnimationFrame(updatePupils);

  usernameInput.addEventListener('focus', () => {
    following = false;
    setLookTargetFromEl(usernameInput);
    snakes.forEach(s => s.classList.remove('shy'));
  });
  usernameInput.addEventListener('input', () => setLookTargetFromEl(usernameInput));
  usernameInput.addEventListener('blur', () => { following = true; });

  passwordInput.addEventListener('focus', () => {
    following = false;
    setLookTargetFromEl(passwordInput);
  });
  passwordInput.addEventListener('input', () => {
    setLookTargetFromEl(passwordInput);
    document.getElementById('passwordField').classList.remove('invalid');
  });
  passwordInput.addEventListener('blur', () => { following = true; });

  const pwToggle = document.getElementById('pwToggle');
  const pwEyeOpen = document.getElementById('pwEyeOpen');
  const pwEyeClosed = document.getElementById('pwEyeClosed');
  let pwRevealed = false;

  pwToggle.addEventListener('click', () => {
    pwRevealed = !pwRevealed;
    passwordInput.type = pwRevealed ? 'text' : 'password';
    pwEyeOpen.style.display = pwRevealed ? 'none' : 'block';
    pwEyeClosed.style.display = pwRevealed ? 'block' : 'none';
    pwToggle.setAttribute('aria-label', pwRevealed ? 'Hide password' : 'Show password');

    if (pwRevealed) {
      following = false;
      snakes.forEach(s => s.classList.add('shy'));
    } else {
      snakes.forEach(s => s.classList.remove('shy'));
      setLookTargetFromEl(passwordInput);
    }
  });

  function reactShake() {
    snakes.forEach(s => {
      s.classList.remove('happy');
      s.classList.add('hurt', 'shake');
      setTimeout(() => s.classList.remove('shake'), 500);
      setTimeout(() => s.classList.remove('hurt'), 1200);
    });
  }
  function reactHappy() {
    snakes.forEach(s => {
      s.classList.remove('hurt', 'shy');
      s.classList.add('happy', 'jump');
    });
  }

  const form = document.getElementById('authForm');
  const errorBox = document.getElementById('authError');
  const setupBanner = document.getElementById('setupBanner');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  const authHeading = document.getElementById('authHeading');
  const authSub = document.getElementById('authSub');
  let needsSetup = false;

  const googleBtn = document.getElementById('googleBtn');
  const googleNote = document.getElementById('googleNote');

  if (new URLSearchParams(window.location.search).get('google') === '1') {
    googleNote.classList.add('show');
  }
  googleBtn.addEventListener('click', () => {
    googleNote.classList.add('show');
  });

  fetch('/api/auth/needs-setup')
    .then(r => r.json())
    .then(({ needsSetup: ns }) => {
      needsSetup = ns;
      if (ns) {
        setupBanner.classList.add('show');
        nameField.style.display = 'block';
        submitBtn.textContent = 'Create owner account';
        authHeading.textContent = 'Set up your shop';
        authSub.textContent = 'Create the owner account to get started.';
      }
    });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();

    const endpoint = needsSetup ? '/api/auth/setup' : '/api/auth/login';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, name }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Something went wrong';
        errorBox.classList.add('show');
        document.getElementById('passwordField').classList.add('invalid');
        reactShake();
        return;
      }
      document.getElementById('passwordField').classList.remove('invalid');
      reactHappy();
      setTimeout(() => {
        window.location.href = data.role === 'owner' ? '/dashboard.html' : '/pos.html';
      }, 550);
    } catch (err) {
      errorBox.textContent = 'Could not reach the server.';
      errorBox.classList.add('show');
      reactShake();
    }
  });
</script>
</body>
</html>
