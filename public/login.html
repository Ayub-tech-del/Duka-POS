<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Duka POS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="transitions.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green-deep);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 8px 5px, rgba(245,239,224,0.05) 4px, transparent 4.5px);
    background-size: 32px 32px;
    pointer-events: none;
  }
  .auth-card {
    position: relative;
    width: 100%;
    max-width: 400px;
    background: var(--ink);
    border: 1px solid rgba(245,239,224,0.08);
    border-radius: 18px;
    padding: 40px 34px 34px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.4);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .auth-mark {
    width: 44px; height: 44px;
    border-radius: 10px;
    object-fit: contain;
    flex-shrink: 0;
    font-weight: 900;
    font-size: 21px;
    box-shadow: 0 0 0 1px rgba(245,239,224,0.12);
  }
  .auth-brand h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    margin: 0;
    color: var(--paper);
  }
  .auth-tag {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    color: rgba(245,239,224,0.55);
    margin: 2px 0 28px 58px;
  }
  .google-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #131314;
    border: 1px solid #8e918f;
    border-radius: 10px;
    padding: 12px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14px;
    color: #e3e3e3;
    cursor: pointer;
    margin-bottom: 18px;
    transition: box-shadow 0.15s, transform 0.1s, background 0.15s;
  }
  .google-btn:hover { background: #1e1f20; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
  .google-btn:active { transform: scale(0.98); }
  .divider {
    display: flex; align-items: center;
    text-align: center;
    color: rgba(245,239,224,0.45);
    font-size: 12px;
    margin: 0 0 20px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid rgba(245,239,224,0.14);
  }
  .divider span { padding: 0 12px; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: rgba(245,239,224,0.6);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .auth-field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1.5px solid rgba(245,239,224,0.18);
    background: rgba(245,239,224,0.06);
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--paper);
    outline: none;
  }
  .auth-field input::placeholder { color: rgba(245,239,224,0.32); }
  .auth-field input:focus { border-color: var(--green); }
  .auth-submit {
    width: 100%;
    margin-top: 6px;
    background: var(--green);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s;
  }
  .auth-submit:hover { background: var(--green-deep); transform: translateY(-1px); }
  .auth-submit:active { transform: translateY(0) scale(0.98); }
  .auth-error {
    background: rgba(181,72,42,0.22);
    border: 1px solid rgba(240,165,140,0.35);
    color: #f0a58c;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-toggle {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--green);
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    font-size: 13px;
  }
  .setup-banner {
    background: rgba(232,163,61,0.2);
    border: 1px solid rgba(232,163,61,0.4);
    color: #f0c675;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-bottom: 18px;
    display: none;
  }
  .setup-banner.show { display: block; }
</style>
</head>
<body>
<div id="pageCurtain"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="logo.svg" alt="Duka POS logo" class="auth-mark">
      <h1>Duka POS</h1>
    </div>
    <p class="auth-tag">Leo ni leo — get paid on the spot</p>

    <div id="setupBanner" class="setup-banner">No account exists yet — create the owner login below to get started.</div>
    <div id="authError" class="auth-error"></div>

    <button type="button" id="googleBtn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.93C16.64 14.2 17.64 11.9 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.93-2.27c-.81.54-1.85.86-3.03.86-2.33 0-4.3-1.57-5.01-3.68H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.99 10.73c-.18-.54-.28-1.12-.28-1.73s.1-1.19.28-1.73V4.93H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.07l3.03-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.6-2.6C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.93l3.03 2.34C4.7 5.15 6.67 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="divider"><span>or</span></div>

    <form id="authForm">
      <div class="auth-field" id="nameField" style="display:none">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name" placeholder="e.g. Ayub">
      </div>
      <div class="auth-field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Sign in</button>
    </form>
  </div>
</div>

<script src="transitions.js"></script>
<script>
  const form = document.getElementById('authForm');
  const errorBox = document.getElementById('authError');
  const setupBanner = document.getElementById('setupBanner');
  const nameField = document.getElementById('nameField');
  const submitBtn = document.getElementById('submitBtn');
  let needsSetup = false;

  const googleBtn = document.getElementById('googleBtn');

  const GOOGLE_ERRORS = {
    google_not_configured: 'Google sign-in isn\'t set up yet — ask the owner to add Google OAuth credentials to .env.',
    google_failed: 'Google sign-in failed. Please try again.',
    google_unverified_email: 'That Google account\'s email isn\'t verified.',
    google_no_account: 'No account found for that Google email. Ask the owner to add you as staff with a matching email.',
  };
  const googleError = new URLSearchParams(window.location.search).get('error');
  if (googleError && GOOGLE_ERRORS[googleError]) {
    errorBox.textContent = GOOGLE_ERRORS[googleError];
    errorBox.classList.add('show');
  }

  googleBtn.addEventListener('click', () => {
    navigateWithFade('/api/auth/google');
  });

  fetch('/api/auth/needs-setup')
    .then(r => r.json())
    .then(({ needsSetup: ns }) => {
      needsSetup = ns;
      if (ns) {
        setupBanner.classList.add('show');
        nameField.style.display = 'block';
        submitBtn.textContent = 'Create owner account';
      }
    });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();

    const endpoint = needsSetup ? '/api/auth/setup' : '/api/auth/login';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, name }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Something went wrong';
        errorBox.classList.add('show');
        return;
      }
      navigateWithFade(data.role === 'owner' ? '/dashboard.html' : '/pos.html');
    } catch (err) {
      errorBox.textContent = 'Could not reach the server.';
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
